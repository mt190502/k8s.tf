version: 3
automerge: true
projects:
  - name: k8s.tf
    dir: .
    workflow: terragrunt
    autoplan:
      enabled: true
      when_modified:
        - "prod.values.hcl"
        - "secrets.hcl"
        - "terragrunt.stack.hcl"
        - "modules/common.hcl"
        - "modules/manifests/**/*.tf"
        - "modules/manifests/**/*.hcl"