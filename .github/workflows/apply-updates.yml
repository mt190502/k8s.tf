name: Apply Updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - modules/manifests/**

permissions:
  contents: read

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s.tf
        uses: actions/checkout@v6
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
          
      - name: Install Terragrunt with OpenTofu
        uses: gruntwork-io/terragrunt-action@v3
        with:
          # renovate: datasource=github-releases depName=gruntwork-io/terragrunt
          tg_version: "0.93.8"
          # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_version: "1.10.9"
          
      - name: Connect Cluster with Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Insert Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p /root/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > /root/.kube/config
          chmod 600 /root/.kube/config

          if [ -n "${SECRETS_CONTENT:-}" ]; then
            printf '%s' "$SECRETS_CONTENT" > secrets.hcl
          fi
          
      - name: Apply updates with Terragrunt
        run: |
          set -euo pipefail
          make manifests-apply
