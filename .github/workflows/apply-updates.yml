name: Apply Updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - modules/manifests/**

permissions:
  contents: read

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s.tf
        uses: actions/checkout@v6
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Install SOPS
        env:
          SOPS_VERSION: "3.12.2"
        run: |
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo mv sops-v${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          
      - name: Install Terragrunt with OpenTofu
        uses: gruntwork-io/terragrunt-action@v3
        with:
          # renovate: datasource=github-releases depName=gruntwork-io/terragrunt
          tg_version: "0.93.8"
          # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_version: "1.10.9"
          
      - name: Connect Cluster with Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Insert Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          
      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY_FILE: /tmp/age.key
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SOPS_AGE_KEY" > "$SOPS_AGE_KEY_FILE"
          chmod 600 "$SOPS_AGE_KEY_FILE"
          sops -i -d secrets.hcl

      - name: Apply updates with Terragrunt
        env:
          SOPS_AGE_KEY_FILE: /tmp/age.key
        run: |
          set -euo pipefail
          make manifests-apply
